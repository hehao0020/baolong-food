var canvas=document.getElementById('mapCanvas');
var ctx=canvas.getContext('2d');
var tooltip=document.getElementById('tooltip');
var W=640,H=580;
var dpr=window.devicePixelRatio||1;
canvas.width=W*dpr; canvas.height=H*dpr;
canvas.style.width=W+'px'; canvas.style.height=H+'px';
ctx.scale(dpr,dpr);

function draw(){
  ctx.clearRect(0,0,W,H);
  // Grid lines
  ctx.strokeStyle='rgba(255,255,255,0.03)';
  ctx.lineWidth=0.5;
  for(var x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(var y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  // Area connection lines
  for(var ak in areas){
    var a=areas[ak];
    ctx.strokeStyle=a.color+'20';
    ctx.lineWidth=1; ctx.setLineDash([4,4]);
    for(var i=0;i<a.shops.length;i++){
      var s=a.shops[i];
      ctx.beginPath();ctx.moveTo(a.cx,a.cy);ctx.lineTo(s.mx,s.my);ctx.stroke();
    }
  }
  ctx.setLineDash([]);
  // Area labels
  ctx.font='bold 12px Noto Sans SC,PingFang SC,sans-serif'; ctx.textAlign='center';
  for(var ak in areas){
    var a=areas[ak];
    ctx.fillStyle=a.color+'30'; ctx.font='bold 13px Noto Sans SC,PingFang SC,sans-serif';
    ctx.fillText(a.label,a.cx,a.cy-14);
    // Center dot
    ctx.beginPath();ctx.arc(a.cx,a.cy,5,0,Math.PI*2);
    ctx.fillStyle=a.color+'40'; ctx.fill();
  }
  // Shops
  for(var ak in areas){
    var a=areas[ak];
    for(var i=0;i<a.shops.length;i++){
      var s=a.shops[i];
      // Glow
      var g=ctx.createRadialGradient(s.mx,s.my,0,s.mx,s.my,12);
      g.addColorStop(0,a.color+'60'); g.addColorStop(1,a.color+'00');
      ctx.fillStyle=g; ctx.beginPath();ctx.arc(s.mx,s.my,12,0,Math.PI*2);ctx.fill();
      // Dot
      ctx.beginPath();ctx.arc(s.mx,s.my,4.5,0,Math.PI*2);
      ctx.fillStyle=a.color; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1.2; ctx.stroke();
      // Emoji
      ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.fillText(s.emoji,s.mx,s.my-8);
    }
  }
  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.font='10px Noto Sans SC,PingFang SC,sans-serif';
  ctx.textAlign='left'; ctx.fillText('北 ↑ 隆昌路',8,18);
  ctx.textAlign='right'; ctx.fillText('周家嘴路 →',W-8,H-8);
}
draw();

function getScale(){
  var rect=canvas.getBoundingClientRect();
  return {sx:W/rect.width, sy:H/rect.height};
}

function findShop(e){
  var rect=canvas.getBoundingClientRect();
  var x=(e.clientX-rect.left)*(W/rect.width);
  var y=(e.clientY-rect.top)*(H/rect.height);
  var best=null, bestDist=15;
  for(var ak in areas){
    var a=areas[ak];
    for(var i=0;i<a.shops.length;i++){
      var s=a.shops[i];
      var dx=s.mx-x, dy=s.my-y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<bestDist){bestDist=d;best={shop:s,area:a};}
    }
  }
  return best;
}

function showTooltip(e,hit){
  if(!hit){tooltip.style.display='none';return;}
  var s=hit.shop, a=hit.area;
  tooltip.style.display='block';
  tooltip.innerHTML='<div class="tt-name">'+s.emoji+' '+s.name+'</div><div class="tt-addr">'+s.addr+'</div><div class="tt-price">'+s.price+'</div><div class="tt-dishes">'+(s.dishes||'')+'</div>';
  var tx=e.clientX+16, ty=e.clientY-10;
  if(tx+270>window.innerWidth) tx=e.clientX-280;
  if(ty<10) ty=10;
  if(ty+80>window.innerHeight) ty=window.innerHeight-90;
  tooltip.style.left=tx+'px'; tooltip.style.top=ty+'px';
}

canvas.addEventListener('mousemove',function(e){
  var hit=findShop(e); showTooltip(e,hit);
  canvas.style.cursor=hit?'pointer':'default';
});
canvas.addEventListener('click',function(e){
  var hit=findShop(e);
  if(hit){showTooltip(e,hit);setTimeout(function(){tooltip.style.display='none'},3000)}
});
canvas.addEventListener('touchstart',function(e){
  var t=e.touches[0]; var hit=findShop(t);
  if(hit){
    showTooltip(t,hit);
    setTimeout(function(){tooltip.style.display='none'},3000);
  }
});
document.addEventListener('click',function(e){
  if(!e.target.closest('#mapCanvas')) tooltip.style.display='none';
});
</script>
</body>
