*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans SC",-apple-system,PingFang SC,sans-serif;background:#0f0f1a;min-height:100vh;padding:20px;background-image:radial-gradient(ellipse at 20% 50%,rgba(255,107,53,0.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 50%,rgba(255,200,50,0.08) 0%,transparent 50%)}
.container{max-width:560px;width:100%;margin:0 auto}
.header{text-align:center;margin-bottom:24px}

.header h1{font-size:26px;font-weight:900;color:#fff;letter-spacing:2px}

.header .sub{font-size:13px;color:rgba(255,255,255,0.4);margin-top:6px;line-height:1.5}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;justify-content:center}
.filter-tag{padding:6px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer;transition:all .25s;font-family:inherit}
.filter-tag:hover{background:rgba(255,255,255,0.1);color:#fff}
.filter-tag.active{background:linear-gradient(135deg,#ff6b35,#ffc832);color:#0f0f1a;border-color:transparent;font-weight:700}

.area-tag{padding:4px 12px;border-radius:14px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.45);font-size:12px;cursor:pointer;transition:all .25s;font-family:inherit}
.area-tag:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7)}
.area-tag.active{background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.2);font-weight:600}
.lottery-card{background:linear-gradient(145deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:32px 24px 28px;text-align:center;position:relative;overflow:hidden}
.lottery-card::before{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(255,107,53,0.03) 60deg,transparent 120deg,rgba(255,200,50,0.03) 180deg,transparent 240deg,rgba(255,107,53,0.03) 300deg,transparent);animation:rotateBg 20s linear infinite;pointer-events:none;z-index:0}

.lottery-card>*{position:relative;z-index:1}
.result-area{min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;margin-bottom:20px}
.placeholder{color:rgba(255,255,255,0.2);font-size:15px;letter-spacing:2px;line-height:1.8}
.placeholder .big-e{font-size:56px;display:block;margin-bottom:10px}
.r-show{display:none;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}

.r-show.v{display:block}
.r-name{font-size:32px;font-weight:900;color:#fff;margin-bottom:4px;line-height:1.3}
.r-name .e{margin-right:8px}
.r-shop{font-size:18px;color:rgba(255,255,255,0.7);margin-bottom:4px;font-weight:500}

.r-area{font-size:13px;color:rgba(255,255,255,0.35);margin-bottom:2px}

.lottery-btn .bi{font-size:22px}

.dish-item .i-price{font-size:12px;color:#ff8a5c;font-weight:500}
.dish-item .i-tag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.footer{text-align:center;margin-top:28px;font-size:12px;color:rgba(255,255,255,0.2);line-height:1.8}
.footer a{color:rgba(255,255,255,0.35);text-decoration:none}
.footer a:hover{color:rgba(255,255,255,0.6)}

var curFilter='all', curArea='all', spinning=false;
var ph=document.getElementById('placeholder'), rs=document.getElementById('resultShow');
var rd=document.getElementById('resultDish'), rsh=document.getElementById('resultShop');
var rp=document.getElementById('resultPrice'), ra=document.getElementById('resultArea');
var rds=document.getElementById('resultDishes'), grid=document.getElementById('dishGrid');
var cnt=document.getElementById('shopCount'), btn=document.getElementById('lotteryBtn');
var cc=document.getElementById('confettiContainer');

function filtered(){
  var f=curFilter==='all'?shops:shops.filter(function(s){return s.cat===curFilter});
  if(curArea!=='all') f=f.filter(function(s){return s.area===curArea});
  return f;
}

function renderGrid(){
  var f=filtered();
  cnt.textContent=f.length+' 家店';
  var h='';
  for(var i=0;i<f.length;i++){
    var s=f[i], d=s.rep_dishes||[], dp=d.map(function(x){return x.name+(x.price?' ¥'+x.price:'')}).join('、');
    h+='<div class="dish-item" data-idx="'+i+'"><div class="i-name"><span class="i-tag" style="background:'+(areaColor(s.area)||'#666')+'"></span>'+s.emoji+' '+s.name+'</div><div class="i-addr">'+s.addr+' · '+s.dist+'</div><div class="i-dishes">'+dp+'</div></div>';
  }
  grid.innerHTML=h;
  [].slice.call(grid.children).forEach(function(el){
    el.addEventListener('click',function(){
      var f=filtered(), idx=+this.dataset.idx;
      if(idx<f.length) showResult(f[idx]);
      else pickOne();
    });
  });
}

function areaColor(a){
  var m={'商场内':'#ff6b35','顺平路':'#4ecdc4','隆昌路':'#a78bfa','隆昌路站4号口':'#fb923c','周家嘴路':'#34d399','控江路':'#f472b6'};
  return m[a]||'#666';
}

function showResult(s){
  ph.style.display='none'; rs.classList.add('v');
  rd.textContent=s.emoji+' '+s.name;
  rsh.innerHTML=s.name+' <span class="tag">'+s.dist+'</span>';
  rp.textContent='¥'+(s.price_min||'?')+' ~ ¥'+(s.price_max||'?');
  ra.textContent='📍 '+s.area+' · '+s.addr;
  var d=s.rep_dishes||[], dp=d.map(function(x){return '<span>'+x.name+(x.price?' ¥'+x.price:'')+'</span>'}).join('');
  rds.innerHTML=dp?'代表菜品: '+dp:'';
}

function pickOne(){
  if(spinning) return;
  var f=filtered();
  if(!f.length){alert('没有符合条件的店铺！');return}
  spinning=true; btn.disabled=true;
  btn.innerHTML='<span class="bi">🎰</span><span>转起来...</span>';
  document.getElementById('lotteryCard').classList.add('spinning');
  var c=0, n=10+Math.random()*8|0, iv=70+Math.random()*30|0;
  var si=setInterval(function(){
    var r=f[Math.random()*f.length|0];
    showResult(r); c++;
    if(c>=n){
      clearInterval(si);
      var r2=f[Math.random()*f.length|0];
      showResult(r2);
      document.getElementById('lotteryCard').classList.remove('spinning');
      spinning=false; btn.disabled=false;
      btn.innerHTML='<span class="bi">🎲</span><span>再抽一签！</span>';
      confetti();
    }
  },iv);
}

function confetti(){
  var cs=['#ff6b35','#ffc832','#ff4d6d','#4ecdc4','#a78bfa','#fb923c','#34d399','#f472b6'];
  cc.innerHTML='';
  for(var i=0;i<60;i++){
    var p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=Math.random()*100+'%';
    p.style.background=cs[Math.random()*cs.length|0];
    var sz=4+Math.random()*10|0;
    p.style.width=sz+'px'; p.style.height=sz+'px';
    p.style.borderRadius=Math.random()>.5?'50%':'2px';
    p.style.animationDuration=1.5+Math.random()*2.5+'s';
    p.style.animationDelay=Math.random()*0.8+'s';
    cc.appendChild(p);
  }
  setTimeout(function(){cc.innerHTML=''},5000);
}

document.getElementById('filters').addEventListener('click',function(e){
  var t=e.target.closest('.filter-tag');
  if(!t) return;
  [].slice.call(this.children).forEach(function(x){x.classList.remove('active')});
  t.classList.add('active');
  curFilter=t.dataset.filter;
  renderGrid();
});

document.getElementById('areaFilters').addEventListener('click',function(e){
  var t=e.target.closest('.area-tag');
  if(!t) return;
  [].slice.call(this.children).forEach(function(x){x.classList.remove('active')});
  t.classList.add('active');
  curArea=t.dataset.area;
  renderGrid();
});

btn.addEventListener('click',pickOne);
document.addEventListener('keydown',function(e){
  if(e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'&&(e.key===' '||e.code==='Space')){
    e.preventDefault(); pickOne();
  }
});
renderGrid();
